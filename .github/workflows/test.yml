name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      # ubuntu-latest ships Chrome; Ferrum finds it on PATH.
      - run: bundle exec rake test
      - run: bundle exec rubocop
